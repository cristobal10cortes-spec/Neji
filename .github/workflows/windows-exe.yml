# Compila NejiPOS.exe en Windows: pruebas, ejecutable, prueba de la ventana real e instalador.
# El resultado se descarga desde la pestaña Actions (artefactos «NejiPOS-Instalador-<versión>» y
# «NejiPOS-portable-<versión>»). Al subir un tag vX.Y.Z además se publica como Release.
name: NejiPOS.exe (Windows)

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # una prueba lee una versión antigua del esquema con git show

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-exe.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Solo lo de Neji POS (requirements.txt también trae PyQt6 y pandas de CORAND)
          python -m pip install -r requirements-exe.txt "pytest>=8.0"

      - name: Pruebas
        run: python -m pytest -q

      - name: Versión
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.1.$env:GITHUB_RUN_NUMBER" }
          Add-Content -Path $env:GITHUB_ENV -Value "NEJI_VERSION=$v"
          Write-Host "Versión: $v"

      # El código de Neji (el paquete neji y escritorio.py) se compila con Nuitka (gratis, licencia Apache) a módulos
      # nativos .pyd: el programa no lleva el código Python de Neji, solo esos módulos (ver NejiPOS.spec).
      - name: Compilar el código de Neji con Nuitka
        run: |
          python -m pip install "nuitka==4.2.2"
          $salida = Join-Path (Get-Location) 'build\nuitka'
          python -m nuitka --module neji --include-package=neji --output-dir="$salida" --remove-output --no-pyi-file --msvc=latest --assume-yes-for-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka no pudo compilar el paquete neji' }
          python -m nuitka --module escritorio.py --output-dir="$salida" --remove-output --no-pyi-file --msvc=latest --assume-yes-for-downloads
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka no pudo compilar escritorio.py' }
          Get-ChildItem $salida -Filter *.pyd | Format-Table Name, Length
          Add-Content -Path $env:GITHUB_ENV -Value "NEJI_COMPILADO=$salida"

      - name: Compilar NejiPOS.exe
        run: |
          python -m PyInstaller --noconfirm --clean empaquetado/NejiPOS.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller falló' }
          Add-Content $env:GITHUB_STEP_SUMMARY 'Código de Neji **compilado con Nuitka** (módulos nativos, sin el código Python).'

      - name: Prueba sin ventana (servidor, archivos y motor WebView2 empaquetado)
        timeout-minutes: 5
        run: |
          $informe = Join-Path $env:RUNNER_TEMP 'prueba.json'
          $p = Start-Process -FilePath 'dist\NejiPOS\NejiPOS.exe' -ArgumentList '--prueba', '--salida', "`"$informe`"" -Wait -PassThru
          if (Test-Path $informe) { Get-Content $informe -Raw } else { Write-Host 'No se generó el informe' }
          if ($p.ExitCode -ne 0) { throw "La prueba falló (código $($p.ExitCode))" }
          # La versión que muestra el programa (ventana, entrada y Configuración) es la de esta compilación.
          $v = (Get-Content $informe -Raw | ConvertFrom-Json).version
          if ($v -ne $env:NEJI_VERSION) { throw "El programa dice la versión '$v' y debía decir '$env:NEJI_VERSION'" }
          # Y corre con el código compilado (Nuitka), no con el código Python.
          if (-not (Get-Content $informe -Raw | ConvertFrom-Json).codigo_compilado) { throw 'El programa no usa el código compilado con Nuitka' }

      - name: Prueba de impresoras (una impresora de tickets de prueba que escribe en un archivo)
        timeout-minutes: 6
        run: |
          # Una impresora con el controlador «Generic / Text Only» de Windows y un puerto que escribe en un
          # archivo: así se ve exactamente lo que Neji le manda (ESC/POS) y que el modo Windows (GDI) imprime.
          $archivo = Join-Path $env:RUNNER_TEMP 'ticket.prn'
          $nombre = 'POS-80 Prueba Neji'
          try {
            Start-Service Spooler -ErrorAction SilentlyContinue
            Add-PrinterDriver -Name 'Generic / Text Only' -ErrorAction Stop
            Add-PrinterPort -Name $archivo -ErrorAction Stop
            Add-Printer -Name $nombre -DriverName 'Generic / Text Only' -PortName $archivo -ErrorAction Stop
          } catch {
            Write-Host "::warning::No se pudo crear la impresora de prueba en esta máquina: $_"
            exit 0
          }
          function Neji($argumentos, $informe) {
            $p = Start-Process -FilePath 'dist\NejiPOS\NejiPOS.exe' -ArgumentList ($argumentos + @('--salida', "`"$informe`"")) -Wait -PassThru
            if (Test-Path $informe) { Write-Host (Get-Content $informe -Raw) } else { Write-Host 'No se generó el informe' }
            return $p.ExitCode
          }
          function Esperar-Archivo {
            for ($i = 0; $i -lt 40; $i++) {
              if ((Test-Path $archivo) -and (Get-Item $archivo).Length -gt 0) { Start-Sleep -Milliseconds 500; return [IO.File]::ReadAllBytes($archivo) }
              Start-Sleep -Milliseconds 500
            }
            throw 'La cola de impresión no escribió el ticket'
          }

          # 1. La ve sola, como impresora de tickets.
          $lista = Join-Path $env:RUNNER_TEMP 'impresoras.json'
          if ((Neji @('--listar-impresoras') $lista) -ne 0) { throw 'No se pudieron listar las impresoras' }
          $prueba = (Get-Content $lista -Raw | ConvertFrom-Json).impresoras | Where-Object { $_.nombre -eq $nombre }
          if (-not $prueba) { throw 'Neji POS no ve la impresora de prueba' }
          if (-not $prueba.termica) { throw 'No la reconoce como impresora de tickets' }

          # 2. ESC/POS directo: los bytes llegan tal cual, con tildes en la página 850, corte al final.
          if ((Neji @('--prueba-impresora', "`"$nombre`"") (Join-Path $env:RUNNER_TEMP 'escpos.json')) -ne 0) { throw 'Falló la impresión ESC/POS' }
          $bytes = Esperar-Archivo
          [Text.Encoding]::RegisterProvider([Text.CodePagesEncodingProvider]::Instance)
          $texto = [Text.Encoding]::GetEncoding(850).GetString($bytes)
          if ($bytes[0] -ne 0x1B -or $bytes[1] -ne 0x40) { throw 'El ticket no empieza con ESC @' }
          if (-not $texto.Contains('Tildes y eñes: áéíóú')) { throw 'Las tildes no llegaron bien (página 850)' }
          if ($bytes[-4] -ne 0x1D -or $bytes[-3] -ne 0x56) { throw 'Falta el corte de papel al final' }
          Write-Host "ESC/POS: $($bytes.Length) bytes"
          Remove-Item $archivo

          # 3. Con el controlador de Windows (GDI): cualquier impresora.
          if ((Neji @('--prueba-impresora', "`"$nombre`"", '--modo', 'windows') (Join-Path $env:RUNNER_TEMP 'windows.json')) -ne 0) { throw 'Falló la impresión con el controlador de Windows' }
          $bytes = Esperar-Archivo
          $texto = [Text.Encoding]::Default.GetString($bytes)
          Write-Host "Windows (GDI): $($bytes.Length) bytes"
          Write-Host $texto
          # «Generic / Text Only» pasa el dibujo a su propia grilla de letras: el texto puede variar.
          if (-not $texto.Contains('Prueba')) { Write-Host '::warning::El texto del modo Windows no se reconoce en la salida de «Generic / Text Only»' }

      - name: Asegurar Microsoft Edge WebView2 Runtime
        run: |
          $claves = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                    'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = $claves | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv } | Select-Object -First 1
          if ($pv) { Write-Host "WebView2 Runtime $pv"; exit 0 }
          Write-Host 'Instalando WebView2 Runtime...'
          $instalador = Join-Path $env:RUNNER_TEMP 'webview2.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $instalador
          Start-Process $instalador -ArgumentList '/silent', '/install' -Wait

      - name: Prueba con la ventana real (dos veces, para ver que se conserva lo guardado)
        timeout-minutes: 8
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'ventana'
          foreach ($vez in 1, 2) {
            $informe = Join-Path $env:RUNNER_TEMP "ventana-$vez.json"
            $p = Start-Process -FilePath 'dist\NejiPOS\NejiPOS.exe' -ArgumentList '--prueba-ventana', "`"$carpeta`"", '--salida', "`"$informe`"" -Wait -PassThru
            if (Test-Path $informe) { Get-Content $informe -Raw } else { Write-Host 'No se generó el informe' }
            if ($p.ExitCode -ne 0) { throw "La ventana no cargó bien (vez $vez, código $($p.ExitCode))" }
          }
          $segunda = Get-Content (Join-Path $env:RUNNER_TEMP 'ventana-2.json') -Raw | ConvertFrom-Json
          if ($segunda.anterior -ne 'guardado') { throw 'La ventana no conservó lo guardado entre aperturas' }

      - name: Prueba como descarga de internet (archivos marcados por Windows, ruta con tildes)
        timeout-minutes: 8
        run: |
          # Al descomprimir un .zip descargado, Windows marca cada archivo (Zone.Identifier) y .NET
          # se niega a cargar esas DLL. Se imita eso en una carpeta con espacios, tildes y eñe.
          function Copia-Marcada($destino) {
            New-Item -ItemType Directory -Force -Path $destino | Out-Null
            Copy-Item -Recurse -Force 'dist\NejiPOS' $destino
            $archivos = Get-ChildItem (Join-Path $destino 'NejiPOS') -Recurse -File
            $archivos | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
            Write-Host "$($archivos.Count) archivos marcados en $destino"
            return (Join-Path $destino 'NejiPOS\NejiPOS.exe')
          }
          function Prueba-Ventana($exe, $nombre) {
            $informe = Join-Path $env:RUNNER_TEMP "$nombre.json"
            $carpeta = Join-Path $env:RUNNER_TEMP "datos-$nombre"
            # Se inicia sin pasar por el aviso «¿Desea ejecutar este archivo?» de Windows (en el PC
            # del usuario ese aviso ya se aceptó; aquí nadie puede presionar «Ejecutar»).
            $inicio = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($argumento in '--prueba-ventana', $carpeta, '--salida', $informe) { $inicio.ArgumentList.Add($argumento) }
            $inicio.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($inicio)
            $p.WaitForExit()
            if (Test-Path $informe) { Write-Host (Get-Content $informe -Raw) } else { Write-Host 'No se generó el informe' }
            return $p.ExitCode
          }

          # 1. Sin las protecciones nuevas (sin desbloquear y sin NejiPOS.exe.config): ¿falla como en el PC del usuario?
          $exe = Copia-Marcada (Join-Path $env:RUNNER_TEMP 'Sin protección Ñandú')
          Remove-Item (Join-Path (Split-Path $exe) 'NejiPOS.exe.config') -ErrorAction SilentlyContinue
          $env:NEJI_SIN_DESBLOQUEO = '1'
          $codigo = Prueba-Ventana $exe 'sin-proteccion'
          Remove-Item Env:NEJI_SIN_DESBLOQUEO
          Write-Host "Sin protecciones: código $codigo (distinto de 0 = se reproduce el problema)"

          # 2. Con las protecciones: tiene que abrir.
          $exe = Copia-Marcada (Join-Path $env:RUNNER_TEMP 'Descargas de Cristóbal Ñúñez')
          $codigo = Prueba-Ventana $exe 'descargado'
          if ($codigo -ne 0) { throw "La ventana no abrió con archivos marcados como descargados (código $codigo)" }

      - name: Revisar el paquete
        run: |
          if (Test-Path 'dist\NejiPOS\datos') { throw 'El paquete no debe llevar datos' }
          if (-not (Test-Path 'dist\NejiPOS\NejiPOS.exe.config')) { throw 'Falta NejiPOS.exe.config junto al .exe' }
          foreach ($modulo in 'neji', 'escritorio') {
            if (-not (Get-ChildItem 'dist\NejiPOS\_internal' -Filter "$modulo.*.pyd")) { throw "Falta el módulo compilado $modulo" }
          }
          if (Get-ChildItem 'dist\NejiPOS\_internal\neji' -Recurse -Include *.py, *.pyc) { throw 'El paquete lleva código Python de Neji' }
          "{0:N1} MB" -f ((Get-ChildItem dist\NejiPOS -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Instalador (Inno Setup)
        run: |
          # Instalador oficial de WebView2: el de Neji lo ejecuta solo si el equipo no lo tiene.
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build\MicrosoftEdgeWebview2Setup.exe
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc empaquetado\NejiPOS.iss
          Get-Item "dist\NejiPOS-Instalador-$env:NEJI_VERSION.exe" | Format-List Name, Length

      - name: Probar el instalador (instalación silenciosa en una ruta con tildes)
        timeout-minutes: 8
        run: |
          $destino = Join-Path $env:RUNNER_TEMP 'Programas de José Ñúñez\Neji POS'
          # Como en una actualización real: Neji POS (otra copia, de otra carpeta) queda abierto y el
          # instalador lo tiene que cerrar; si no, se seguiría viendo la versión anterior.
          $env:NEJI_DATOS = Join-Path $env:RUNNER_TEMP 'datos-abierto'
          $abierto = Start-Process -FilePath 'dist\NejiPOS\NejiPOS.exe' -PassThru
          $listo = $false
          foreach ($i in 1..60) {
            try { Invoke-WebRequest 'http://127.0.0.1:5000/api/estado' -UseBasicParsing -TimeoutSec 2 | Out-Null; $listo = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          Remove-Item Env:NEJI_DATOS
          if (-not $listo) { throw 'No se pudo dejar Neji POS abierto antes de instalar' }
          $p = Start-Process -FilePath "dist\NejiPOS-Instalador-$env:NEJI_VERSION.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destino`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador terminó con el código $($p.ExitCode)" }
          Start-Sleep -Seconds 1
          if (Get-Process -Id $abierto.Id -ErrorAction SilentlyContinue) { throw 'El instalador no cerró el Neji POS que estaba abierto' }
          Write-Host 'El instalador cerró el Neji POS abierto.'
          foreach ($archivo in 'NejiPOS.exe', 'NejiPOS.exe.config', '_internal\python312.dll') {
            if (-not (Test-Path (Join-Path $destino $archivo))) { throw "El instalador no dejó $archivo" }
          }
          $informe = Join-Path $env:RUNNER_TEMP 'instalado.json'
          $carpeta = Join-Path $env:RUNNER_TEMP 'datos-instalado'
          $p = Start-Process -FilePath (Join-Path $destino 'NejiPOS.exe') -ArgumentList '--prueba-ventana', "`"$carpeta`"", '--salida', "`"$informe`"" -Wait -PassThru
          if (Test-Path $informe) { Get-Content $informe -Raw } else { Write-Host 'No se generó el informe' }
          if ($p.ExitCode -ne 0) { throw "El programa instalado no abrió la ventana (código $($p.ExitCode))" }

      - name: Versión portátil
        run: Compress-Archive -Path dist\NejiPOS -DestinationPath "dist\NejiPOS-portable-$env:NEJI_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NejiPOS-Instalador-${{ env.NEJI_VERSION }}
          path: dist/NejiPOS-Instalador-${{ env.NEJI_VERSION }}.exe
          if-no-files-found: error
          retention-days: 60

      - uses: actions/upload-artifact@v4
        with:
          name: NejiPOS-portable-${{ env.NEJI_VERSION }}
          path: dist/NejiPOS-portable-${{ env.NEJI_VERSION }}.zip
          if-no-files-found: error
          retention-days: 60

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            descargas/NejiPOS-Instalador-*.exe
            descargas/NejiPOS-portable-*.zip
